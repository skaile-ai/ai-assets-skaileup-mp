id: skaileup-concept-only
version: "0.1.0"
name: Skaileup Concept Only
description: >-
  The conceptualization half on its own, for handing a specified product to someone
  else to build. Same path as Appbuilder Standard up to the mockup and its feedback
  pass, then stops: no blueprint, no code, and no Storybook — that one authors
  components, which this flow does not do. Ends on a concept review.
meta:
  icon: i-heroicons-document-text
  onboarding:
    input_style: structured
    fields:
      - app_name
      - problem
      - audience
      - notes
requires:
  # Exact and self-contained: every skill this flow's own nodes run, plus every
  # contract those skills read. No inheritance, no extras.
  - contract:@skaile-ai/acceptance_criteria
  - contract:@skaile-ai/agent_patterns
  - contract:@skaile-ai/artifact_frontmatter
  - contract:@skaile-ai/concept_structure
  - contract:@skaile-ai/domain_model
  - contract:@skaile-ai/elements_block
  - contract:@skaile-ai/evaluator
  - contract:@skaile-ai/feedback_loop
  - contract:@skaile-ai/golden_principles
  - contract:@skaile-ai/slice_loop
  - contract:@skaile-ai/walkthrough_renderer
  - skill:@skaile-ai/concept-scope
  - skill:@skaile-ai/concept-onboard
  - skill:@skaile-ai/concept-brief
  - skill:@skaile-ai/concept-research
  - skill:@skaile-ai/design-brand
  - skill:@skaile-ai/experience-journeys
  - skill:@skaile-ai/spec-featuresets
  - skill:@skaile-ai/experience-behaviors
  - skill:@skaile-ai/experience-shell
  - skill:@skaile-ai/spec-feature
  - skill:@skaile-ai/mockup-walkthrough
  - skill:@skaile-ai/mockup-annotate
  - skill:@skaile-ai/mockup-feedback
  - skill:@skaile-ai/ops-review
globals:
  research_depth: moderate
entry: scope
nodes:
  # Phase containers. They carry the swimlane geometry and the phase every child
  # repeats on its own node — the group's phase wins where the two are read together
  # (forge-concept `flow-layout.ts`), so both come from one table. This flow builds
  # nothing, so the implementation container stays empty.
  - id: g-conceptualization
    type: group
    position: { x: 0, y: 0 }
    style: { width: 2680, height: 240 }
    data:
      label: Conceptualization
      phase: conceptualization
  - id: g-implementation
    type: group
    position: { x: 2720, y: 0 }
    style: { width: 280, height: 240 }
    data:
      label: Implementation
      phase: implementation
  - id: g-review
    type: group
    position: { x: 3040, y: 0 }
    style: { width: 280, height: 240 }
    data:
      label: Review
      phase: review

  - id: scope
    type: skill
    parentNode: g-conceptualization
    data:
      skill: concept-scope
      label: Scope
      phase: conceptualization
  - id: onboard
    type: skill
    parentNode: g-conceptualization
    data:
      skill: concept-onboard
      label: Onboard
      phase: conceptualization
  - id: brief
    type: skill
    parentNode: g-conceptualization
    data:
      skill: concept-brief
      label: Brief
      phase: conceptualization
  - id: research
    type: skill
    parentNode: g-conceptualization
    data:
      skill: concept-research
      label: Research
      phase: conceptualization
  - id: brand
    type: skill
    parentNode: g-conceptualization
    data:
      skill: design-brand
      label: Brand
      phase: conceptualization
  - id: journeys
    type: skill
    parentNode: g-conceptualization
    data:
      skill: experience-journeys
      label: Journeys
      phase: conceptualization
  - id: featuresets
    type: skill
    parentNode: g-conceptualization
    data:
      skill: spec-featuresets
      label: Featuresets
      phase: conceptualization
  - id: behaviors
    type: skill
    parentNode: g-conceptualization
    data:
      skill: experience-behaviors
      label: Behaviours
      phase: conceptualization
  - id: shell
    type: skill
    parentNode: g-conceptualization
    data:
      skill: experience-shell
      label: App Shell
      phase: conceptualization
  # spec-feature runs once per feature and writes that feature's screens; the graph
  # below shows one iteration. The loop lives in the skill body.
  - id: feature
    type: skill
    parentNode: g-conceptualization
    data:
      skill: spec-feature
      label: Feature Spec
      phase: conceptualization
  - id: walkthrough
    type: skill
    parentNode: g-conceptualization
    data:
      skill: mockup-walkthrough
      label: Walkthrough
      phase: conceptualization
  - id: annotate
    type: skill
    parentNode: g-conceptualization
    data:
      skill: mockup-annotate
      label: Annotate
      phase: conceptualization
  - id: feedback
    type: skill
    parentNode: g-conceptualization
    data:
      skill: mockup-feedback
      label: Feedback
      phase: conceptualization

  - id: ops-review
    type: skill
    parentNode: g-review
    data:
      skill: ops-review
      label: Concept Review
      phase: review
edges:
  - { id: e-scope-onboard, source: scope, target: onboard, type: flow }
  - { id: e-onboard-brief, source: onboard, target: brief, type: flow }
  - { id: e-brief-research, source: brief, target: research, type: flow }
  - { id: e-research-brand, source: research, target: brand, type: flow }
  - { id: e-brand-journeys, source: brand, target: journeys, type: flow }
  - { id: e-journeys-featuresets, source: journeys, target: featuresets, type: flow }
  - { id: e-featuresets-behaviors, source: featuresets, target: behaviors, type: flow }
  - { id: e-behaviors-shell, source: behaviors, target: shell, type: flow }
  - { id: e-shell-feature, source: shell, target: feature, type: flow }
  - { id: e-feature-walkthrough, source: feature, target: walkthrough, type: flow }
  - { id: e-walkthrough-annotate, source: walkthrough, target: annotate, type: flow }
  - { id: e-annotate-feedback, source: annotate, target: feedback, type: flow }
  - { id: e-feedback-ops-review, source: feedback, target: ops-review, type: flow }
