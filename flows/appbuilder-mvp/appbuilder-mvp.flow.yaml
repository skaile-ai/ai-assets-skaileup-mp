id: appbuilder-mvp
version: "0.1.0"
name: Appbuilder MVP
description: >-
  The lean end-to-end path: scope, a brief, one featureset pass, a stack pick, then
  scaffold, plan and build. No design layer, no mockup and no data-modelling layer —
  the template supplies the ORM default and the schema grows inside the slice.
meta:
  icon: i-heroicons-rocket-launch
  onboarding:
    input_style: structured
    fields:
      - app_name
      - problem
      - audience
      - notes
requires:
  # Exact and self-contained: every skill this flow's own nodes run, plus every
  # contract those skills read. No inheritance, no extras.
  - contract:@skaile-ai/acceptance_criteria
  - contract:@skaile-ai/agent_patterns
  - contract:@skaile-ai/artifact_frontmatter
  - contract:@skaile-ai/concept_structure
  - contract:@skaile-ai/domain_model
  - contract:@skaile-ai/feedback_loop
  - contract:@skaile-ai/seed_data
  - contract:@skaile-ai/slice_loop
  - skill:@skaile-ai/concept-scope
  - skill:@skaile-ai/concept-onboard
  - skill:@skaile-ai/concept-brief
  - skill:@skaile-ai/spec-featuresets
  - skill:@skaile-ai/architecture-techstack
  - skill:@skaile-ai/build-scaffold
  - skill:@skaile-ai/build-plan
  - skill:@skaile-ai/build-implement
  - skill:@skaile-ai/quality-test
globals:
  research_depth: skip
entry: scope
nodes:
  # Phase containers. They carry the swimlane geometry and the phase every child
  # repeats on its own node — the group's phase wins where the two are read together
  # (forge-concept `flow-layout.ts`), so both come from one table.
  - id: g-conceptualization
    type: group
    position: { x: 0, y: 0 }
    style: { width: 1080, height: 240 }
    data:
      label: Conceptualization
      phase: conceptualization
  - id: g-implementation
    type: group
    position: { x: 1120, y: 0 }
    style: { width: 680, height: 240 }
    data:
      label: Implementation
      phase: implementation
  - id: g-review
    type: group
    position: { x: 1840, y: 0 }
    style: { width: 280, height: 240 }
    data:
      label: Review
      phase: review

  - id: scope
    type: skill
    parentNode: g-conceptualization
    data:
      skill: concept-scope
      label: Scope
      phase: conceptualization
  - id: onboard
    type: skill
    parentNode: g-conceptualization
    data:
      skill: concept-onboard
      label: Onboard
      phase: conceptualization
  - id: brief
    type: skill
    parentNode: g-conceptualization
    data:
      skill: concept-brief
      label: Brief
      phase: conceptualization
  - id: featuresets
    type: skill
    parentNode: g-conceptualization
    data:
      skill: spec-featuresets
      label: Featuresets
      phase: conceptualization
  - id: techstack
    type: skill
    parentNode: g-conceptualization
    data:
      skill: architecture-techstack
      label: Tech Stack
      phase: conceptualization

  - id: scaffold
    type: skill
    parentNode: g-implementation
    data:
      skill: build-scaffold
      label: Scaffold
      phase: implementation
  # build-plan and build-implement repeat per feature and per slice; the graph below
  # shows one iteration. The loop lives in those two skill bodies.
  - id: plan
    type: skill
    parentNode: g-implementation
    data:
      skill: build-plan
      label: Plan Slices
      phase: implementation
  - id: implement
    type: skill
    parentNode: g-implementation
    data:
      skill: build-implement
      label: Implement Slice
      phase: implementation

  - id: test
    type: skill
    parentNode: g-review
    data:
      skill: quality-test
      label: Tests
      phase: review
edges:
  - { id: e-scope-onboard, source: scope, target: onboard, type: flow }
  - { id: e-onboard-brief, source: onboard, target: brief, type: flow }
  - { id: e-brief-featuresets, source: brief, target: featuresets, type: flow }
  - { id: e-featuresets-techstack, source: featuresets, target: techstack, type: flow }
  - { id: e-techstack-scaffold, source: techstack, target: scaffold, type: flow }
  - { id: e-scaffold-plan, source: scaffold, target: plan, type: flow }
  - { id: e-plan-implement, source: plan, target: implement, type: flow }
  - { id: e-implement-test, source: implement, target: test, type: flow }
